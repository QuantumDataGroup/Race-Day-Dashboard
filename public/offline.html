<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121a27">
<title>RacingHub – offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0d1420; color: #e6eaf0; font-family: "Segoe UI", Roboto, Arial, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 22px; margin: 18px 0 6px; }
  h1 span { color: #f5a524; }
  p { color: #9aa6b8; margin: 0 0 22px; font-size: 15px; line-height: 1.5; }
  button { background: #f5a524; color: #121a27; border: 0; border-radius: 10px; padding: 12px 22px; font-size: 15px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>RACING<span>HUB</span> is offline</h1>
    <p>No connection to the dashboard right now.<br>It will come back as soon as the network does.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>

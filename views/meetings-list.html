<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Day Dashboard - Meetings List</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header-left">
      <a class="brand" href="/">
        <img src="/logo.png" class="brand-icon" alt="RacingHub logo">
        <div class="brand-text">
          <span class="brand-name">RACING<span class="brand-name-accent">HUB</span></span>
          <span class="brand-subtitle">Meetings List</span>
        </div>
      </a>
    </div>
    <div class="app-header-right">
      <a class="meetings-list-link" href="/"><i class="fa-solid fa-arrow-left"></i> Back to dashboard</a>
      <button type="button" class="theme-toggle" id="themeToggle" onclick="toggleTheme()"><i class="fa-solid fa-sun"></i> Light</button>
      {{USERNAME_BLOCK}}
    </div>
  </header>

  <div class="control-bar">
    <form class="controls meetings-filters" method="GET" action="/meetings-list-view">
      <label>From:
        <input type="date" name="from" value="{{FROM_DATE}}">
      </label>
      <label>To:
        <input type="date" name="to" value="{{TO_DATE}}">
      </label>
      <label>Country:
        <select name="country">
          <option value="">All countries</option>
          {{COUNTRY_OPTIONS}}
        </select>
      </label>
      <label>Discipline:
        <select name="discipline">
          <option value="">All disciplines</option>
          {{DISCIPLINE_OPTIONS}}
        </select>
      </label>
      <label>TAB/Non-TAB:
        <select name="tab">
          <option value="">All</option>
          {{TAB_OPTIONS}}
        </select>
      </label>
      <label>
        <input type="checkbox" name="includeTrials" value="true" {{INCLUDE_TRIALS_CHECKED}}>
        Include trials
      </label>
      <button type="submit" class="day-nav">Filter</button>
      {{DOWNLOAD_LINKS_HTML}}
    </form>
  </div>

  <main class="app-main">
    <div class="disc-section">
      <div class="disc-section-card-header">
        <h2><i class="fa-regular fa-calendar-days"></i> {{HEADING}}</h2>
        <span class="disc-section-count">{{RESULT_COUNT}} meeting(s) found</span>
      </div>
      <div class="table-scroll">
        <table class="meetings-list-table">
          <thead>
            <tr>
              <th>Date</th><th>Country</th><th>Discipline</th><th>Meeting</th><th>TAB/Non-TAB</th>
              <th>Races</th><th>First Race</th><th>Trial</th><th>Abandoned</th>
            </tr>
          </thead>
          <tbody>
{{ROWS_HTML}}
          </tbody>
        </table>
      </div>
    </div>
  </main>
  <script>
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      var btn = document.getElementById('themeToggle');
      if (btn) btn.innerHTML = theme === 'light' ? '<i class="fa-solid fa-moon"></i> Dark' : '<i class="fa-solid fa-sun"></i> Light';
    }
    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme') || 'dark';
      var next = current === 'light' ? 'dark' : 'light';
      try { localStorage.setItem('rdd_theme_v2', next); } catch (e) { /* ignore */ }
      applyTheme(next);
    }
    (function init() {
      // v2 key (17 Sep 2026, per Dinesh) -- see dashboard.html's init() for
      // why: ignores any stale pre-redesign "light" value under the old key.
      var savedTheme = 'dark';
      try { savedTheme = localStorage.getItem('rdd_theme_v2') || 'dark'; } catch (e) { /* ignore */ }
      applyTheme(savedTheme);
    })();
  </script>
</body>
</html>
